name: MusicApp
options:
  deploymentTarget:
    iOS: "17.0"
targets:
  MusicApp:
    type: application
    platform: iOS
    sources: [Sources]
    dependencies:
      - target: MusicWidget
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.musicapp
        CODE_SIGN_ENTITLEMENTS: Sources/MusicApp.entitlements
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: MusicApp
        UIBackgroundModes: [audio]
        UILaunchScreen: {}
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        CFBundleIcons:
          CFBundlePrimaryIcon:
            CFBundleIconName: AppIcon
          CFBundleAlternateIcons:
            DSMMono:
              CFBundleIconFiles: [DSMMono]
              CFBundleIconName: DSMMono
              UIPrerenderedIcon: true
            DSMBlue:
              CFBundleIconFiles: [DSMBlue]
              CFBundleIconName: DSMBlue
              UIPrerenderedIcon: true
            DSMPurple:
              CFBundleIconFiles: [DSMPurple]
              CFBundleIconName: DSMPurple
              UIPrerenderedIcon: true

  MusicWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources: [Widget]
    info:
      path: Widget/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.musicapp.widget
        CODE_SIGN_ENTITLEMENTS: Widget/Widget.entitlements
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
