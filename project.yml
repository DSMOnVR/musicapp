name: MusicApp
options:
  deploymentTarget:
    iOS: "17.0"
targets:
  MusicApp:
    type: application
    platform: iOS
    sources: [Sources]
    entitlements: Sources/MusicApp.entitlements
    dependencies:
      - target: MusicWidget
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.musicapp
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: MusicApp
        UIBackgroundModes: [audio]
        UILaunchScreen: {}
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true

  MusicWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources: [Widget]
    entitlements: Widget/Widget.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.musicapp.widget
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_NSExtension_NSExtensionPointIdentifier: com.apple.widgetkit-extension
