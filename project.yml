name: MusicApp
packages:
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 7.1.0
options:
  deploymentTarget:
    iOS: "17.0"
targets:
  MusicApp:
    type: application
    platform: iOS
    sources: [Sources]
    dependencies:
      - package: GoogleSignIn
        product: GoogleSignIn
      - target: MusicWidget
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.musicapp
        CODE_SIGN_ENTITLEMENTS: Sources/MusicApp.entitlements
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: "DSMMono DSMBlue DSMPurple"
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: DSM Music
        GIDClientID: 1085184799984-a0h55etclaaufp26mmdak4fhfi8e7nie.apps.googleusercontent.com
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - com.googleusercontent.apps.1085184799984-a0h55etclaaufp26mmdak4fhfi8e7nie
        UIBackgroundModes: [audio]
        UILaunchScreen: {}
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
  MusicWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources: [Widget]
    info:
      path: Widget/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.musicapp.widget
        CODE_SIGN_ENTITLEMENTS: Widget/Widget.entitlements
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
